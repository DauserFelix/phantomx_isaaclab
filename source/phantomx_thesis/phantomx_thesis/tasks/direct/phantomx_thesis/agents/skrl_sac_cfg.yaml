seed: 1

models:
  separate: True  # SAC always uses separate models
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -5.0
    max_log_std: 2.0
    initial_log_std: -1.9      # Fix 2: log(0.15) — small initial std for safe exploration
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256, 256]      # war [128,128] (davor [512,256,128], siehe Session-Log 2026-07-09, Punkt 10)
        activations: elu
    output: ACTIONS

  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256, 256]
        activations: elu
    output: ONE

  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256, 256]
        activations: elu
    output: ONE

  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256, 256]
        activations: elu
    output: ONE

  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256, 256]
        activations: elu
    output: ONE

memory:
  class: NStepMemory          # Fix 3: N-step replay buffer
  memory_size: 125000         # abgestimmt auf PhantomxThesisSACEnvCfg.scene.num_envs=128 (gleicher
                               # Gesamtbuffer ~16M wie die 32-env-Runs). Bei anderem --num_envs neu
                               # skalieren: memory_size ≈ 16_000_000 / num_envs.
  n_steps: 3                  # Fix 3: 3-step returns (RSL-RL-SAC paper recommendation)
  replacement: True           # Fix 5: torch.randint statt torch.randperm über den ganzen Buffer — sonst
                               # kostet jedes sample() O(memory_size*num_envs) statt O(batch_size) (siehe Session-Log 2026-07-09)

agent:
  class: CustomSAC
  gradient_steps: 1
  batch_size: 2048
  discount_factor: 0.97
  polyak: 0.005
  learning_rate: 3.0e-4
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: {}
  state_preprocessor: null
  state_preprocessor_kwargs: null
  random_timesteps: 8000
  learning_starts: 8000
  grad_norm_clip: 0.5
  learn_entropy: True
  initial_entropy_value: 0.5
  target_entropy: -9.0         # war -18.0 (=-dim(A)) — weniger negativ, damit Exploration (alpha)
                                # nicht schon vor Curriculum-Phase 2 (Step ~100k-400k) kollabiert
  mixed_precision: False
  # rewards_shaper_scale removed — Fix 1 (physics action bounds) replaces reward scaling
  experiment:
    directory: "phantomx_sac"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 600000   # zurueckgesetzt von 200000 (war ein kurzer isolierter Diagnose-Testlauf
                        # aus einer frueheren Session, nie fuer den vollen Lauf zurueckgesetzt).
                        # Fuer einen erneuten kurzen Diagnoselauf hier bewusst temporaer senken.
  environment_info: log
